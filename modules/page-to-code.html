const escapeCode=text=>text.replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
function highlightCode(line){
  const mark=(type,text)=>`<span class="syntax-${type}">${escapeCode(text)}</span>`;
  return line.split(/(<!--[\s\S]*?-->|<\/?[A-Za-z][^>]*>)/g).map(token=>{
    if(token.startsWith('<!--'))return mark('comment',token);
    const tag=token.match(/^(<\/?)([\w-]+)([\s\S]*?)(\/?>)$/);
    if(!tag)return escapeCode(token);
    let attributes='',cursor=0;
    for(const match of tag[3].matchAll(/([\w:-]+)(\s*=\s*)("[^"]*"|'[^']*')/g)){
      attributes+=escapeCode(tag[3].slice(cursor,match.index))+mark('attribute',match[1])+mark('punctuation',match[2])+mark('string',match[3]);
      cursor=match.index+match[0].length;
    }
    attributes+=escapeCode(tag[3].slice(cursor));
    return mark('punctuation',tag[1])+mark('tag',tag[2])+attributes+mark('punctuation',tag[4]);
  }).join('');
}
pageData.forEach(p=>{
  const card=document.createElement('article');card.className='card '+p.id;card.dataset.page=p.id;card.innerHTML=cardContent[p.id];cardsRoot.append(card);
  const code=document.createElement('div');code.className='code';
  const filename=p.id==='home'?'index.html':p.url.replace('kessler.co/','')+'.html';
  const source=`<!-- distilled: ${p.distilled.toLocaleString('en-US')} tokens -->\n<!-- original: ${p.original.toLocaleString('en-US')} tokens -->\n<!-- ${p.url} -->\n${p.html}`;
  code.innerHTML=`<div class="editor-bar"><span class="editor-lights"><i></i><i></i><i></i></span><span class="editor-filename"><span class="editor-file-icon">&lt;/&gt;</span>${escapeCode(filename)}</span></div><div class="editor-body">${source.split('\n').map((line,i)=>`<div class="code-line"><span class="line-number">${i+1}</span><span class="line-source">${highlightCode(line)||' '}</span></div>`).join('')}</div><div class="editor-status"><span class="editor-status-label">Distilled HTML</span><span>UTF-8 · HTML</span></div>`;
  codesRoot.append(code);
});
/* One clock keeps DOM clipping, the token readout and the canvas in sync. */
(() => {
  'use strict';

  const belt = document.querySelector('.belt');
  const cards = [...belt.querySelectorAll('.cards .card')];
  const codes = [...belt.querySelectorAll('.codes .code')];
  const canvas = belt.querySelector('canvas.fx');
  const ctx = canvas.getContext('2d', { alpha: true });
  const count = document.querySelector('.badge .count');
  const percent = document.querySelector('.badge .percent');
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const formatter = new Intl.NumberFormat('en-US');
  const palette = ['#FF4A12', '#FF5A1F', '#FF6B2C', '#FF8A3D', '#FFB06A', '#FFD9B5', '#FFF3E6'];
  const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
  const mod = (n, d) => ((n % d) + d) % d;
  const hash = (a, b, c) => {
    let h = (Math.imul(a, 374761393) + Math.imul(b, 668265263) + Math.imul(c, 2147483647)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  };

  /* Resolve --gap through layout so viewport units remain correct on mobile. */
  const gapProbe = document.createElement('span');
  gapProbe.style.cssText = 'position:absolute;left:0;top:0;width:var(--gap);height:0;visibility:hidden;pointer-events:none';
  gapProbe.setAttribute('aria-hidden', 'true');
  belt.append(gapProbe);

  let width = 0;
  let height = 0;
  let cw = 0;
  let ch = 0;
  let span = 0;
  let period = 0;
  let lineX = 0;
  let off = 0;
  let vel = 0;
  let hover = 0;
  let hoverTarget = 0;
  let dragging = false;
  let pointerId = null;
  let lastPointerX = 0;
  let lastPointerTime = 0;
  let lastFrame = 0;
  let shown = 0;
  let crossingIndex = -1;
  let reduced = motion.matches;
  let sparks = [];
  const positions = cards.map(() => ({ x: 0, cut: 0 }));

  function measure() {
    const oldSpan = span;
    const phase = oldSpan ? (lineX - off) / oldSpan : 0;
    const rect = belt.getBoundingClientRect();
    const cardRect = cards[0].getBoundingClientRect();
    width = rect.width;
    height = rect.height;
    cw = cardRect.width;
    ch = cardRect.height;
    span = cw + gapProbe.getBoundingClientRect().width;
    period = span * cards.length;
    lineX = innerWidth / 2;
    off = oldSpan ? lineX - phase * span : lineX - .62 * cw;
    if (!oldSpan) vel = reduced ? 0 : -.075 * innerWidth;
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    canvas.style.width = `${width}px`;
    canvas.style.height = `${height}px`;
    if (ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    sparks = [];
  }

  function placeCards(dt) {
    let active = -1;
    for (let i = 0; i < cards.length; i++) {
      const x = mod(off + i * span + span, period) - span;
      const cut = clamp(lineX - x, 0, cw);
      const transform = `translate3d(${x.toFixed(3)}px,0,0)`;
      cards[i].style.transform = transform;
      codes[i].style.transform = transform;
      cards[i].style.clipPath = cut > 0
        ? `inset(0 0 0 ${cut.toFixed(3)}px round 0 1.6vw 1.6vw 0)`
        : 'none';
      const mask = cut > 0
        ? `linear-gradient(90deg,transparent ${cut.toFixed(3)}px,#000 ${(cut + 26).toFixed(3)}px)`
        : 'none';
      cards[i].style.maskImage = mask;
      cards[i].style.webkitMaskImage = mask;
      codes[i].style.clipPath = `inset(0 ${Math.max(0, cw - cut).toFixed(3)}px 0 0)`;
      codes[i].style.visibility = cut > 0 ? 'visible' : 'hidden';
      positions[i].x = x;
      positions[i].cut = cut;
      if (cut > 0 && cut < cw) active = i;
    }

    if (active !== -1) {
      const page = pageData[active];
      const saved = page.original - page.distilled;
      const target = Math.round(saved * positions[active].cut / cw);
      if (crossingIndex !== active) {
        crossingIndex = active;
        shown = target;
        percent.textContent = `减少 ${Math.round(saved / page.original * 100)}%`;
      } else {
        shown += (target - shown) * Math.min(1, dt * 14);
      }
      count.textContent = `−${formatter.format(Math.round(shown))}`;
    }
  }

  function drawDissolve(i, x, cut, t) {
    if (!ctx) return;
    const remaining = x + cw - lineX;
    if (!(cut > 0 && remaining > 0)) return;
    const haze = ctx.createLinearGradient(lineX, 0, lineX + 150, 0);
    haze.addColorStop(0, 'rgba(255,96,40,.42)');
    haze.addColorStop(1, 'rgba(255,96,40,0)');
    ctx.fillStyle = haze;
    ctx.fillRect(lineX, 70, Math.min(150, remaining), ch);

    const radius = .3 * cw;
    const colsStart = Math.ceil(cut / 3);
    const colsEnd = Math.floor(Math.min(cw, cut + radius) / 3);
    const rows = Math.ceil(ch / 3);
    const tick = Math.floor(t * 9);
    const jitterTick = Math.floor(t * 14);

    /* Paint by palette bucket to avoid thousands of canvas style changes. */
    const buckets = palette.map(() => []);
    for (let gx = colsStart; gx <= colsEnd; gx++) {
      const sx = x + gx * 3;
      const distance = sx - lineX;
      const probability = Math.pow(Math.max(0, 1 - distance / radius), 1.7);
      for (let row = -5; row <= rows + 5; row++) {
        const localY = row * 3;
        const outside = localY < 0 || localY > ch;
        const spill = localY < 0 ? -localY / 15 : (localY - ch) / 15;
        const density = outside ? .16 * Math.max(0, 1 - spill) : .92;
        if (hash(gx, row, i) >= probability * density) continue;
        if (!reduced && hash(gx, row, tick + 97) < .22) continue;
        const h2 = hash(row, gx, i + 31);
        const color = distance < 10 ? 4 + Math.floor(h2 * 3) : Math.floor(h2 * h2 * 7);
        const size = 1.1 + h2 * 1.7;
        const jitterX = reduced ? 0 : (hash(gx, row, jitterTick + 401) - .5) * 1.6;
        const jitterY = reduced ? 0 : (hash(row, gx, jitterTick + 701) - .5) * 1.6;
        buckets[color].push(sx + jitterX, 70 + localY + jitterY, size);
      }
    }
    for (let color = 0; color < buckets.length; color++) {
      ctx.fillStyle = palette[color];
      const dots = buckets[color];
      for (let k = 0; k < dots.length; k += 3) {
        ctx.fillRect(dots[k], dots[k + 1], dots[k + 2], dots[k + 2]);
      }
    }

    if (!reduced) {
      for (let j = 0; j < 3; j++) {
        if (Math.random() >= .7) continue;
        sparks.push({
          x: lineX + Math.random() * Math.min(30, remaining),
          y: 60 + Math.random() * (ch + 20),
          vx: -30 + Math.random() * 70 + vel * .6,
          vy: (Math.random() - .5) * 50,
          size: .8 + Math.random() * 1.8,
          color: palette[Math.floor(Math.random() * palette.length)],
          life: .3 + Math.random() * .8
        });
      }
    }
  }

  function drawFx(dt, time) {
    if (!ctx) return;
    ctx.clearRect(0, 0, width, height);
    ctx.globalAlpha = 1;
    for (let i = 0; i < positions.length; i++) {
      drawDissolve(i, positions[i].x, positions[i].cut, time);
    }
    if (reduced) return;
    for (let i = sparks.length - 1; i >= 0; i--) {
      const spark = sparks[i];
      spark.life -= dt;
      if (spark.life <= 0) {
        sparks.splice(i, 1);
        continue;
      }
      spark.x += spark.vx * dt;
      spark.y += spark.vy * dt;
      ctx.globalAlpha = Math.min(1, spark.life * 2.2);
      ctx.fillStyle = spark.color;
      ctx.fillRect(spark.x, spark.y, spark.size, spark.size);
    }
    ctx.globalAlpha = 1;
  }

  function frame(now) {
    const dt = lastFrame ? Math.min(.05, Math.max(0, (now - lastFrame) / 1000)) : 0;
    lastFrame = now;
    hover += (hoverTarget - hover) * (1 - Math.exp(-4 * dt));
    if (!dragging) {
      const auto = reduced ? 0 : -.075 * innerWidth;
      const target = auto * (1 - .65 * hover);
      vel += (target - vel) * (1 - Math.exp(-2.2 * dt));
      if (reduced && Math.abs(vel) < .05) vel = 0;
      off += vel * dt;
    }
    /* Keep accumulated drag and motion values small without changing phase. */
    if (Math.abs(off) > period * 100) off = mod(off, period);
    placeCards(dt);
    drawFx(dt, now / 1000);
    requestAnimationFrame(frame);
  }

  belt.addEventListener('pointerenter', event => {
    if (event.pointerType !== 'touch') hoverTarget = 1;
  });
  belt.addEventListener('pointerleave', () => { hoverTarget = 0; });
  belt.addEventListener('pointerdown', event => {
    if (!event.isPrimary || (event.pointerType === 'mouse' && event.button !== 0)) return;
    dragging = true;
    pointerId = event.pointerId;
    lastPointerX = event.clientX;
    lastPointerTime = event.timeStamp;
    vel = 0;
    belt.classList.add('dragging');
    belt.setPointerCapture(pointerId);
  });
  belt.addEventListener('pointermove', event => {
    if (!dragging || event.pointerId !== pointerId) return;
    const dx = event.clientX - lastPointerX;
    const elapsed = Math.max(8, event.timeStamp - lastPointerTime);
    off += dx;
    vel = dx / elapsed * 1000 * .8 + vel * .2;
    lastPointerX = event.clientX;
    lastPointerTime = event.timeStamp;
  });

  function release(event) {
    if (!dragging || event.pointerId !== pointerId) return;
    dragging = false;
    belt.classList.remove('dragging');
    if (event.type === 'pointercancel') vel = 0;
    if (belt.hasPointerCapture(pointerId)) belt.releasePointerCapture(pointerId);
    pointerId = null;
    if (event.pointerType === 'touch') hoverTarget = 0;
  }
  belt.addEventListener('pointerup', release);
  belt.addEventListener('pointercancel', release);
  belt.addEventListener('lostpointercapture', release);
  belt.addEventListener('wheel', event => {
    if (Math.abs(event.deltaX) <= Math.abs(event.deltaY)) return;
    event.preventDefault();
    const units = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? width : 1;
    vel -= event.deltaX * units * 6;
  }, { passive: false });
  belt.addEventListener('keydown', event => {
    if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
    event.preventDefault();
    off += (event.key === 'ArrowRight' ? 1 : -1) * cw * .2;
    vel = 0;
  });
  motion.addEventListener('change', event => {
    reduced = event.matches;
    if (reduced) {
      vel = 0;
      sparks = [];
    }
  });
  addEventListener('resize', measure, { passive: true });
  document.addEventListener('visibilitychange', () => { lastFrame = 0; });
  measure();
  requestAnimationFrame(frame);
})();

</script>
