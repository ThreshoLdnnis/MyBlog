<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d49db6">
  <title>照片球</title>
  <style>
    @font-face {
      font-family: "Inter Tight";
      src: url("orbit/inter-tight.woff2") format("woff2");
      font-style: normal;
      font-weight: 400 500;
      font-display: swap;
    }
    :root {
      --ink: #321825;
      --accent: #76234d;
      --gutter: clamp(18px, 2.2vw, 32px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    html { overflow: hidden; }
    body {
      background: #d49db6 url("orbit/pink-glitter.jpg") center / cover no-repeat;
      color: var(--ink);
      font-family: "Inter Tight", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      touch-action: none;
    }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    .stage {
      position: fixed;
      inset: 0;
      perspective: var(--persp, 1200px);
      perspective-origin: 50% 50%;
      cursor: grab;
      z-index: 1;
    }
    .stage.dragging { cursor: grabbing; }
    .world {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
    }
    .card {
      position: absolute;
      left: calc(var(--cw) / -2);
      top: calc(var(--ch) / -2);
      width: var(--cw);
      height: var(--ch);
      transform-style: preserve-3d;
      border-radius: calc(var(--cw) * .045);
      overflow: hidden;
      background: #cfcdc8;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, .35) inset;
      cursor: pointer;
      backface-visibility: visible;
    }
    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      opacity: 0;
      transition: opacity .8s ease;
    }
    .card img.ok { opacity: 1; }
    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(135deg, rgba(255, 255, 255, .18), rgba(255, 255, 255, 0) 40%, rgba(0, 0, 0, .08));
    }


    .ui { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
    .lede {
      position: absolute;
      left: var(--gutter);
      bottom: calc(var(--gutter) + env(safe-area-inset-bottom, 0px));
      width: min(24em, calc(100% - 260px));
      font-size: 1rem;
      line-height: 1.45;
      text-wrap: pretty;
      color: #fff;
      background: #341329b8;
      padding: 8px 12px;
      border-radius: 3px;
    }
    .controls {
      position: absolute;
      right: var(--gutter);
      bottom: calc(var(--gutter) + env(safe-area-inset-bottom, 0px));
      display: flex;
      gap: 6px;
    }
    .controls button {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border: 1px solid #6b3d5529;
      border-radius: 50%;
      color: var(--ink);
      background: #fff9;
      box-shadow: 0 2px 10px #5c234515;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
      transition: background .2s ease, transform .2s ease;
    }
    .controls button:hover { background: #fff; transform: translateY(-2px); }
    .controls svg { width: 19px; height: 19px; }
    .controls [hidden], #rotate .play-icon, #rotate[aria-pressed="true"] .pause-icon { display: none; }
    #rotate[aria-pressed="true"] .play-icon { display: block; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 640px) {
      .lede { width: min(22em, calc(100% - 2 * var(--gutter))); bottom: calc(var(--gutter) + 60px + env(safe-area-inset-bottom, 0px)); }
      .controls { gap: 8px; }
    }
    @media (max-height: 440px) and (orientation: landscape) {
      .lede { width: min(22em, calc(100% - 260px)); bottom: calc(var(--gutter) + env(safe-area-inset-bottom, 0px)); }
    }
    @media (prefers-reduced-motion: reduce) {
      .card img, .controls button { transition: none; }
    }
  </style>
</head>
<body>
  <h1 class="sr-only">照片球</h1>
  <p id="photo-help" class="sr-only">拖动旋转照片球，点按照片放大。放大后按左右方向键切换同层照片，按 Escape 返回。</p>
  <div class="stage" id="stage" role="group" aria-label="三维照片球" aria-describedby="photo-help"><div class="world" id="world"></div></div>
  <div class="ui" id="ui">
    <p class="lede" lang="en">A little world of my life, my friends, and our memories.</p>
    <span class="sr-only" id="counter" role="status" aria-live="polite" aria-atomic="true">照片球，共 12 张照片</span>
    <nav class="controls" aria-label="照片操作">
      <button id="home" type="button" aria-label="返回照片球" title="返回照片球">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><ellipse cx="12" cy="12" rx="4" ry="8.5"/><path d="M3.5 12h17"/></svg>
      </button>
      <button id="trip" type="button" aria-label="查看下一张照片" title="查看下一张照片">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="13" height="13" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v11M4 16l4-4 3 3 2-2 3 3"/><circle cx="12" cy="10" r="1"/></svg>
      </button>
      <button id="launch" type="button" aria-label="随机查看一张照片" title="随机查看一张照片">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><g fill="currentColor" stroke="none"><circle cx="8" cy="8" r="1.2"/><circle cx="16" cy="8" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="8" cy="16" r="1.2"/><circle cx="16" cy="16" r="1.2"/></g></svg>
      </button>
      <button id="rotate" type="button" aria-label="暂停自动旋转" aria-pressed="false" title="暂停自动旋转">
        <svg class="pause-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="7" y="5" width="3" height="14" rx="1"/><rect x="14" y="5" width="3" height="14" rx="1"/></svg>
        <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </nav>
  </div>
  <script>
    (() => {
      'use strict';

      // The twelve original Orbit photos, resized for this embedded preview.
      const IMAGES = [
        ['helmet-portrait.webp', 'Helmet Portrait'],
        ['orbital-shuttle.webp', 'Orbital Shuttle'],
        ['ember-crystal.webp', 'Ember Crystal'],
        ['ringed-dunes.webp', 'Ringed Dunes'],
        ['flight-console.webp', 'Flight Console'],
        ['lunar-surface.webp', 'Lunar Surface'],
        ['station-module.webp', 'Station Module'],
        ['gold-visor.webp', 'Gold Visor'],
        ['weightless-cabin.webp', 'Weightless Cabin'],
        ['dusk-launch.webp', 'Dusk Launch'],
        ['lunar-rover.webp', 'Lunar Rover'],
        ['spiral-nebula.webp', 'Spiral Nebula'],
      ].map(([file, name]) => ({ src: 'orbit/' + file, name }));
      const RINGS = [[-68, 4], [-41, 9], [-13.5, 12], [13.5, 12], [41, 9], [68, 4]];
      const stage = document.getElementById('stage');
      const world = document.getElementById('world');
      const ui = document.getElementById('ui');
      const counter = document.getElementById('counter');
      const rotate = document.getElementById('rotate');
      let autoRotate = true;
      const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const cards = [];
      const fragment = document.createDocumentFragment();

      RINGS.forEach(([lat, count], ri) => {
        for (let i = 0; i < count; i++) {
          const n = cards.length;
          const lon = (360 / count) * i + (ri % 2 ? 180 / count : 0);
          const img = IMAGES[(n * 5 + ri) % IMAGES.length];
          const el = document.createElement('div');
          el.className = 'card';
          el.dataset.i = n;
          el.tabIndex = 0;
          el.setAttribute('role', 'button');
          el.setAttribute('aria-pressed', 'false');
          el.setAttribute('aria-label', '查看照片：' + img.name);
          const image = document.createElement('img');
          image.alt = img.name;
          image.decoding = 'async';
          image.draggable = false;
          image.onload = () => image.classList.add('ok');
          image.src = img.src;
          el.appendChild(image);
          fragment.appendChild(el);
          cards.push({ el, lat, lon, img });
        }
      });
      world.appendChild(fragment);

      let R, CW, K, P;
      let focus = null;
      let rx = -14, ry = -40;
      let rxT = -10, ryT = 0;
      let vx = 0, vy = 0;
      let mx = 0, my = 0, pmx = 0, pmy = 0;
      let pointerId = null, lastX = 0, lastY = 0, moved = 0;
      let tripIndex = -1;
      const equator = cards.filter(c => Math.abs(c.lat) < 20);

      const focusWidth = () => Math.min(innerWidth * (innerWidth < 640 ? .86 : .62), innerHeight * .62 / .75);
      const idleZoom = () => P - K * P;
      const focusZoom = () => P * (1 - 1 / (focusWidth() / CW)) - R;
      const nearest = (cur, target) => cur + ((((target - cur) % 360) + 540) % 360 - 180);
      const ease = (k, f) => 1 - Math.pow(1 - k, f);

      function layout() {
        const w = innerWidth, h = innerHeight;
        const mobile = w < 640;
        const r = Math.min(w * (mobile ? .43 : .27), h * (mobile ? .30 : .36));
        const smallW = r * .46;
        // Large intrinsic cards remain sharp when the camera flies into the sphere.
        CW = Math.min(focusWidth(), 640);
        K = CW / smallW;
        R = r * K;
        const CH = CW * .75;
        P = Math.max(900, Math.min(w, h) * 2.2);
        const root = document.documentElement.style;
        root.setProperty('--r', R + 'px');
        root.setProperty('--cw', CW + 'px');
        root.setProperty('--ch', CH + 'px');
        root.setProperty('--persp', P + 'px');
        cards.forEach(c => {
          c.el.style.transform = `rotateY(${c.lon}deg) rotateX(${c.lat}deg) translateZ(${R}px)`;
        });
      }

      layout();
      let zoom = motion.matches ? idleZoom() : P - K * P * 2.6;
      let zoomT = idleZoom();

      function setFocus(c) {
        focus = c;
        vx = vy = 0;
        cards.forEach(card => {
          const active = card === c;
          card.el.classList.toggle('active', active);
          card.el.setAttribute('aria-pressed', String(active));
        });
        if (c) {
          ryT = nearest(ry, -c.lon);
          rxT = -c.lat;
          zoomT = focusZoom();
          counter.textContent = '照片 ' + (IMAGES.indexOf(c.img) + 1) + '，共 ' + IMAGES.length + ' 张';
        } else {
          rxT = -10;
          zoomT = idleZoom();
          counter.textContent = '照片球，共 ' + IMAGES.length + ' 张照片';
        }
        document.body.classList.toggle('focused', Boolean(c));
        ui.classList.toggle('focused-ui', Boolean(c));
        scheduleFrame();
      }

      window.addEventListener('resize', () => {
        layout();
        zoomT = focus ? focusZoom() : idleZoom();
        scheduleFrame();
      });
      function updateRotateControl() {
        rotate.hidden = motion.matches;
        rotate.setAttribute('aria-pressed', String(!autoRotate));
        const label = autoRotate ? '暂停自动旋转' : '继续自动旋转';
        rotate.setAttribute('aria-label', label);
        rotate.title = label;
      }
      updateRotateControl();
      motion.addEventListener('change', () => { vx = vy = 0; updateRotateControl(); scheduleFrame(); });
      rotate.addEventListener('click', () => {
        autoRotate = !autoRotate;
        vx = vy = 0;
        updateRotateControl();
        scheduleFrame();
      });

      stage.addEventListener('pointerdown', event => {
        if (!event.isPrimary || event.button !== 0 || pointerId !== null) return;
        pointerId = event.pointerId;
        lastX = event.clientX;
        lastY = event.clientY;
        moved = 0;
        stage.setPointerCapture(pointerId);
      });

      window.addEventListener('pointermove', event => {
        mx = Math.max(-.5, Math.min(.5, event.clientX / innerWidth - .5));
        my = Math.max(-.5, Math.min(.5, event.clientY / innerHeight - .5));
        scheduleFrame();
        if (event.pointerId !== pointerId) return;
        const dx = event.clientX - lastX;
        const dy = event.clientY - lastY;
        lastX = event.clientX;
        lastY = event.clientY;
        moved += Math.abs(dx) + Math.abs(dy);
        if (moved > 6 && !focus) {
          stage.classList.add('dragging');
          ryT += dx * .25;
          rxT -= dy * .2;
          vy = motion.matches ? 0 : dx * .04;
          vx = motion.matches ? 0 : -dy * .02;
        }
      });

      function resetPointer() {
        const id = pointerId;
        pointerId = null;
        stage.classList.remove('dragging');
        if (id !== null && stage.hasPointerCapture(id)) stage.releasePointerCapture(id);
      }

      window.addEventListener('pointerup', event => {
        if (event.pointerId !== pointerId) return;
        const tapped = moved <= 6;
        resetPointer();
        if (!tapped) return;
        const hit = document.elementsFromPoint(event.clientX, event.clientY)
          .map(el => el.closest('.card'))
          .find(el => el && world.contains(el));
        const c = hit ? cards[Number(hit.dataset.i)] : null;
        if (focus) setFocus(c && c !== focus ? c : null);
        else if (c) setFocus(c);
      });
      window.addEventListener('pointercancel', event => {
        if (event.pointerId === pointerId) resetPointer();
      });
      stage.addEventListener('lostpointercapture', event => {
        if (event.pointerId === pointerId) resetPointer();
      });
      window.addEventListener('blur', () => { resetPointer(); mx = my = 0; scheduleFrame(); });

      window.addEventListener('keydown', event => {
        if (event.key === 'Escape' && focus) {
          event.preventDefault();
          setFocus(null);
        } else if (focus && (event.key === 'ArrowRight' || event.key === 'ArrowLeft')) {
          event.preventDefault();
          const ring = cards.filter(c => c.lat === focus.lat);
          const direction = event.key === 'ArrowRight' ? 1 : -1;
          setFocus(ring[(ring.indexOf(focus) + direction + ring.length) % ring.length]);
        } else if ((event.key === 'Enter' || event.key === ' ') && event.target.matches('.card')) {
          event.preventDefault();
          const c = cards[Number(event.target.dataset.i)];
          setFocus(c === focus ? null : c);
        }
      });

      document.getElementById('home').addEventListener('click', () => setFocus(null));
      document.getElementById('trip').addEventListener('click', () => {
        const current = equator.indexOf(focus);
        tripIndex = ((current >= 0 ? current : tripIndex) + 1) % equator.length;
        setFocus(equator[tripIndex]);
      });
      document.getElementById('launch').addEventListener('click', () => {
        const choices = cards.filter(c => c !== focus);
        setFocus(choices[Math.floor(Math.random() * choices.length)]);
      });

      let frame = 0;
      let previousTime = null;

      function scheduleFrame() {
        if (!frame && !document.hidden) frame = requestAnimationFrame(animate);
      }

      function animate(time) {
        frame = 0;
        const movingEffects = !motion.matches;
        const dt = previousTime === null ? 16.67 : time - previousTime;
        previousTime = time;
        const f = Math.max(.1, Math.min(4, dt / 16.67));
        if (!focus) {
          ryT += ((movingEffects && autoRotate ? .06 : 0) + vy) * f;
          rxT += vx * f;
          vy *= Math.pow(.94, f);
          vx *= Math.pow(.9, f);
          rxT = Math.max(-40, Math.min(40, rxT));
        }
        pmx = movingEffects ? pmx + (mx - pmx) * ease(.06, f) : 0;
        pmy = movingEffects ? pmy + (my - pmy) * ease(.06, f) : 0;
        const rotationEase = movingEffects ? ease(focus ? .075 : .085, f) : 1;
        rx += (rxT - rx) * rotationEase;
        ry += (ryT - ry) * rotationEase;
        zoom += (zoomT - zoom) * (movingEffects ? ease(focus ? .07 : .06, f) : 1);
        const tiltX = focus ? pmy * -3 : pmy * -6;
        const tiltY = focus ? pmx * 4 : pmx * 8;
        world.style.transform = `translateZ(${zoom}px) rotateX(${rx + tiltX}deg) rotateY(${ry + tiltY}deg)`;
        const settling = Math.abs(rxT - rx) > .03 || Math.abs(ryT - ry) > .03
          || Math.abs(zoomT - zoom) > .25 || Math.abs(mx - pmx) > .003 || Math.abs(my - pmy) > .003;
        if (movingEffects && ((!focus && autoRotate) || settling)) scheduleFrame();
        else previousTime = null;
      }
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          cancelAnimationFrame(frame);
          frame = 0;
          previousTime = null;
        } else scheduleFrame();
      });
      scheduleFrame();
    })();
  </script>
</body>
</html>
